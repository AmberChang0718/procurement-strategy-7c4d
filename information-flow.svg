<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">專案資料整理與協作流程</title>
  <desc id="desc">將現場訊息、供應商回覆與版本資料，整理為待辦、責任窗口與確認期限，再供跨單位對齊下一步。</desc>
  <rect width="1200" height="620" fill="#f7f6f1"/>
  <text x="64" y="70" fill="#17343a" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">PROJECT INFORMATION FLOW</text>
  <text x="64" y="105" fill="#6c7d81" font-family="Arial, sans-serif" font-size="18">匿名化重建｜將分散訊息整理為可追蹤的下一步</text>
  <line x1="118" y1="286" x2="1082" y2="286" stroke="#d7e0de" stroke-width="8"/>
  <path d="M386 286h72m-22-22 22 22-22 22M742 286h72m-22-22 22 22-22 22" fill="none" stroke="#168b8a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif">
    <circle cx="220" cy="286" r="72" fill="#17343a"/>
    <text x="220" y="276" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">資訊來源</text>
    <text x="220" y="307" text-anchor="middle" fill="#bfe5df" font-size="16">現場／供應商／版本</text>
    <circle cx="600" cy="286" r="72" fill="#168b8a"/>
    <text x="600" y="276" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">整理追蹤</text>
    <text x="600" y="307" text-anchor="middle" fill="#dff4ef" font-size="16">待辦／窗口／期限</text>
    <circle cx="980" cy="286" r="72" fill="#ec7624"/>
    <text x="980" y="276" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">對齊下一步</text>
    <text x="980" y="307" text-anchor="middle" fill="#fff4e9" font-size="16">工程／採購／現場</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#17343a">
    <rect x="64" y="416" width="320" height="132" rx="8" fill="#fff" stroke="#d7e0de" stroke-width="2"/>
    <text x="92" y="458" font-size="18" font-weight="700">需要釐清的訊息</text>
    <text x="92" y="492" font-size="16" fill="#607277">交期、圖面版次、現場限制、</text>
    <text x="92" y="518" font-size="16" fill="#607277">供應商回覆與驗收條件</text>
    <rect x="440" y="416" width="320" height="132" rx="8" fill="#fff" stroke="#d7e0de" stroke-width="2"/>
    <text x="468" y="458" font-size="18" font-weight="700">管理紀錄的欄位</text>
    <text x="468" y="492" font-size="16" fill="#607277">影響事項、責任窗口、</text>
    <text x="468" y="518" font-size="16" fill="#607277">確認期限與所需佐證</text>
    <rect x="816" y="416" width="320" height="132" rx="8" fill="#fff" stroke="#d7e0de" stroke-width="2"/>
    <text x="844" y="458" font-size="18" font-weight="700">可供決定的資訊</text>
    <text x="844" y="492" font-size="16" fill="#607277">是否能執行、何時完成、</text>
    <text x="844" y="518" font-size="16" fill="#607277">是否需要調整或升級處理</text>
  </g>
</svg>
